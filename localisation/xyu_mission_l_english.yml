l_english:
 ############## MISSION ###############################

 ck_eu_baltic_missions_1_task_1_title:0 "Faith that Binds"
 ck_eu_baltic_missions_1_task_1_desc:0 "No matter what we worship, we must find Kin in those who share our beliefs and strengthen this sacred connection we have in-between."
 ck_eu_baltic_missions_1_task_2_title:0 "Show of Strength"
 ck_eu_baltic_missions_1_task_2_desc:0 "Circumstances have forced us to resort to blade once again. The hardships we now endure may propel our state into something mightier. We are no strangers to war, after all."
 ck_eu_baltic_missions_1_task_3_title:0 "Power in the Baltic"
 ck_eu_baltic_missions_1_task_3_desc:0 "Ever since the times of the Romans, us Balts were considered inferior peoples, even less noteworthy than barbarians. Time for us to make a stand and demonstrate the errors in such judgement."
 ck_eu_baltic_missions_1_task_4_title:0 "Reign in the Warlords"
 ck_eu_baltic_missions_1_task_4_desc:0 "The pride of even the lowliest chief can prove to be a major obstacle in molding of a great state. Through benevolence or harsh measures, we must ensure that whims of nobles do not shroud our bright future."
 ck_eu_baltic_missions_1_task_5_title:0 "Question of Statemanship"
 ck_eu_baltic_missions_1_task_5_desc:0 "Our ancestors were tribal peoples for centuries and now we once again stand at the crossroads of our future - will a King rule [Root.GetName] or shall it be a Republic? Such delicate question must not be left unanswered. "

 ck_eu_europagan_missions_1_task_1_title:0 "Spoils of War"
 ck_eu_europagan_missions_1_task_1_desc:0 "Our ancestors made themselves worldwide famous due to their fearsome raids and brought great riches back to [Root.GetName]. Let us honor their memory properly."
 ck_eu_europagan_missions_1_task_2_title:0 "Raider Fleet"
 ck_eu_europagan_missions_1_task_2_desc:0 "In many cases, a good bounty can be discovered within the merciless winds and thundering waves. Why bother invading an enemy, when we can take their riches in the Sea?"
 ck_eu_europagan_missions_1_task_3_title:0 "Invest into Homeland"
 ck_eu_europagan_missions_1_task_3_desc:0 "Regardless of what wealth we bring home, a good [Root.Monarch.GetTitle] must also oversee growth of his own lands. Perhaps, with proper management, we can make [Root.GetName] a rich and self-sufficient country?"
 ck_eu_europagan_missions_1_task_4_title:0 "Religious Pragmatism"
 ck_eu_europagan_missions_1_task_4_desc:0 "The strength of [Root.Religion.GetName] lies in flexibility. The amount of Gods our people worship probably reaches hundreds, if not thousands. We have become more open towards other deities and even - ideas. Let us listen to so called 'heretics' and study what they preach."
 ck_eu_europagan_missions_1_task_5_title:0 "Pagan Fury"
 ck_eu_europagan_missions_1_task_5_desc:0 "Many mighty Kings have risen and justified their atrocities towards pagans by referring to their 'Divine Right', given by their cruel God. Let us give them a proper lesson on theology."

 ck_eu_norse_missions_1_task_1_title:0 "Viking Legacy"
 ck_eu_norse_missions_1_task_1_desc:0 "It's what we are known for and it's what we do best."
 ck_eu_norse_missions_1_task_2_title:0 "Vinlandsaga"
 ck_eu_norse_missions_1_task_2_desc:0 "At long last we have firmly established ourselves in the New World! No Skraeling will stop us now!"
 ck_eu_norse_missions_1_task_3_title:0 "North Sea Empire"
 ck_eu_norse_missions_1_task_3_desc:0 "Our naval might will ensure that we carve ourselves a mighty empire in these cold waters. An ambition that was never realized until now."
 ck_eu_norse_missions_1_task_4_title:0 "Dominate the Baltic"
 ck_eu_norse_missions_1_task_4_desc:0 "Germans, Slavs and even petty Balts continue their fruitless efforts at strengthening their position as major merchants in the Baltic Sea. Sadly for them, there is an already established overlord of this trade region - [Root.GetName]!"
 ck_eu_norse_missions_1_task_5_title:0 "Unrivaled Naval Industry"
 ck_eu_norse_missions_1_task_5_desc:0 "It seems that the demand for Naval Supplies will only grow in the future. We must secure enough of these resources to ensure our wealth and influence through them."

 ck_eu_euromuslim_missions_1_task_1_title:0 "Alh Ulh Dhimma"
 ck_eu_euromuslim_missions_1_task_1_desc:0 "Through inter-religious dialogue and benevolence we will help misguided Christians and Jews embrace the light of Allah. And until they do it, we might as well learn great wisdom they have amassed during their 'misguidedness'."
 ck_eu_euromuslim_missions_1_task_2_title:0 "Sword of Islam"
 ck_eu_euromuslim_missions_1_task_2_desc:0 "The Umma suffers from foreign threats and heathenous invasions. We must step in!"
 ck_eu_euromuslim_missions_1_task_3_title:0 "Revive the Golden Age"
 ck_eu_euromuslim_missions_1_task_3_desc:0 "Many believe that the Golden Age of Islam is over, yet we stand as a living proof that flourishing of sciences and arts never ceased. On the contrary - it continues to grow and prosper in [Root.GetName]!"
 ck_eu_euromuslim_missions_1_task_4_title:0 "Custodians of Rome"
 ck_eu_euromuslim_missions_1_task_4_desc:0 "For nearly an entirety of Middle Ages noble city of Rome was in a disgusting state of decay with ancient monuments being dismembered brick by brick. Clearly Christians shown their incompetence at ruling over these once glorious lands. Let us step in and stop this ignorance and preserve the remaining legacy of Rome!"
 ck_eu_euromuslim_missions_1_task_5_title:0 "Trail of Ibn Battuta"
 ck_eu_euromuslim_missions_1_task_5_desc:0 "Many brave and learned adventurers and scholars have traveled distant lands, capturing the culture and life of incredibly diverse peoples. This also opened new trade opportunities, strengthening the exchange of goods and technologies throughout Andalus, Egypt, Persia and India. Let us send bold and daring merchants on their own adventures! "

 ck_eu_jewish_missions_1_task_1_title:0 "Restore Israel"
 ck_eu_jewish_missions_1_task_1_desc:0 "No longer shall Jewish man be ruled by a heathen Lord! We have our own state and soon we shall take back our Home!"
 ck_eu_jewish_missions_1_task_2_title:0 "The Third Temple"
 ck_eu_jewish_missions_1_task_2_desc:0 "With Judea finally back in our hands, it is of utmost importance for us to start building The Third Temple! There have been previous attempts at achieving this undertaking in the past, some more successful than others, but under the wise leadership of [Root.Monarch.GetTitle] [Root.Monarch.GetName], this dream shall finally come true!"
 ck_eu_jewish_missions_1_task_3_title:0 "High Priesthood"
 ck_eu_jewish_missions_1_task_3_desc:0 "At long last, the position of High Priest has been filled, and the High Priesthood reconstituted.\n\nLike the Jewish priests of ancient times, the Kohen Gadol was traditionally required to be a descendant of Aaron, the older brother of Moses. Due to a lack of suitable candidates, this requirement has been waived, but the new High Priest still enjoys the respect of the Jewish religious communities."
 ck_eu_jewish_missions_1_task_4_title:0 "Jewish Diaspora"
 ck_eu_jewish_missions_1_task_4_desc:0 "Our people are scattered throughout the World. We must build a new home for them and welcome them here!"
 ck_eu_jewish_missions_1_task_5_title:0 "David's Mighty"
 ck_eu_jewish_missions_1_task_5_desc:0 "Before the Messiah arrives, we must prepare a mighty army for him to lead us into prosperity! Just like David had his 37 mighty warriors, so shall the Messiah have the strongest force in the World!"

 ck_eu_zoroastrian_missions_1_task_1_title:0 "Rising Flame"
 ck_eu_zoroastrian_missions_1_task_1_desc:0 "With enough luck and divine favor, we have managed to control one of the sacred sites of our faith. This will give us much needed uplifting in future fights."
 ck_eu_zoroastrian_missions_1_task_2_title:0 "Keepers of Fire"
 ck_eu_zoroastrian_missions_1_task_2_desc:0 "For too long our holy sites were disgraced by insolence of other faithful. We must put an end to it!"
 ck_eu_zoroastrian_missions_1_task_3_title:0 "Restore Persia"
 ck_eu_zoroastrian_missions_1_task_3_desc:0 "Persia was and always will be a Zoroastrian region in spirit. Even Islam was twisted and reshaped in this land. Our mentality and fiery soul defies foreign faiths!"
 ck_eu_zoroastrian_missions_1_task_4_title:0 "Revive the Empire"
 ck_eu_zoroastrian_missions_1_task_4_desc:0 "What seemed like a daring revanchist struggle, turned out to be a restoration of Zoroastrian state. Truly, a glorious feat."
 ck_eu_zoroastrian_missions_1_task_5_title:0 "Conquests of Cyrus"
 ck_eu_zoroastrian_missions_1_task_5_desc:0 "Our ambition is spreading like forest fire. We have the spirit and strength to continue our conquests and so we shall!"


 
 nov_conquer_tver_title:0 "Conquer Karelia"
 nov_conquer_tver_desc:0 "The lands of Karelia are within our reach. By conquering them, we will expand our influence and secure our borders, and protect the vital port of St. Baylonburg."
 nov_develop_capital_title:0 "Develop the New Capital"
 nov_develop_capital_desc:0 "Our capital has long been in the marshes of Toropets between the three main rivers. It is time to expand our new nation and build upon the shores of St. Baylonburg, the jewel of our realm."
 nov_bogatyr_title:0 "The Bogatyr's Call"
 nov_bogatyr_desc:0 "Our warriors, the legendary bogatyrs, were once the pride of our home in south Kyivan lands, and their legacy continues to inspire us today. We must rebuild our army with their traditions and valor."

 kok_mam_holy_cities_title:0 "The Pharaoh's Cities"
 kok_mam_holy_cities_desc:0 "Our holy cities, blessed by the Pharaoh, are the center of our spiritual and political power. We must reclaim and develop them to ensure the prosperity of our realm."
 egy_sinai_title:0 "The Sinai Peninsula"
 egy_sinai_desc:0 "The Sinai Peninsula is a land of strategic and spiritual importance. We must secure and develop it to strengthen our realm and protect our holy sites."
 mam_incense_trade_title:0 "The Incense Road"
 mam_incense_trade_desc:0 "The old gods demand their offerings. Frankincense and myrrh from the far south must flow through our ports, as they did in the days of the old pharaohs. Alexandria, Damietta, and Suez, the three gates of Egypt, must all serve the incense road once more."

 emp_nap_egyptian_trade_title:0 "The Egyptian Connection"
 emp_nap_egyptian_trade_desc:0 "The spice trade flows through Alexandria, and whoever holds the favour of the Sultan holds the keys to the East. We must cultivate a lasting relationship with Egypt, one that fills Anchovian coffers with the wealth of Arabia."
 emp_nap_egyptian_alliance_title:0 "The Alexandrian Pact"
 emp_nap_egyptian_alliance_desc:0 "Alexandria is the hinge of the eastern Mediterranean. If Egypt holds the city and stands with us, the spice road flows west into Neapolitan hands. A formal pact binds us both, their armies grow sharper, our merchants grow richer."
 emp_nap_adriatic_gate_title:0 "The Adriatic Gate"
 emp_nap_adriatic_gate_desc:0 "Whoever holds both shores of the Strait of Otranto holds the keys to the Adriatic. The Albanian coast has been contested for centuries, between Angevins, Venetians, and Ottomans. We will be the ones to keep it. From Durrës to Vlora, the strait will be ours, and no fleet will pass into the Adriatic without our leave."

 emp_nap_libyan_colonies_title:0 "The Libyan Colonies"
 emp_nap_libyan_colonies_desc:0 "The riches of the Roman history stems into Bengazi, and the fertile lands of Cyrenaica. We must establish and maintain our colonies to secure these valuable resources for our realm."
 emp_nap_northern_italy_title:0 "Northern Italy"
 emp_nap_northern_italy_desc:0 "Milan and Genoa are the richest cities in Italy, and for too long they have answered to others. The plain of Lombardy will be ours, and with it the wealth of the north."
 emp_nap_develop_the_north_title:0 "Develop the North"
 emp_nap_develop_the_north_desc:0 "Genoa has become the workshop of Italy, its harbours busy, its banks full, its artisans in demand from Lisbon to Constantinople. The time has come to extend that prosperity to the whole of the north: to Liguria's terraces, Piedmont's fields, Lombardy's mills, and the rich black earth of Emilia. What Milan and Genoa began, Naples will finish."
 emp_nap_exploit_libya_title:0 "The Libyan Estates"
 emp_nap_exploit_libya_desc:0 "The Libyan shore is ours, but it is not yet profitable. The interior tribes pay tribute in grain and oil, and the ports of Cyrenaica could be made to carry more than they do. A new administration, part governor, part factor, will turn the province into an estate of the Neapolitan crown. The locals will not thank us for it."

 emp_nap_indian_venture_title:0 "The Indian Venture"
 emp_nap_indian_venture_desc:0 "Beyond Egypt, beyond Arabia, beyond the incense road, lies the true source of every spice that has ever enriched a Neapolitan merchant. A single foothold on the Indian coast is worth more than a kingdom in Italy, and we have it. Now the work of expansion begins."
 emp_nap_gujarat_colony_title:0 "The Anchovian Suratella Company"
 emp_nap_gujarat_colony_desc:0 "Ahmedabad was only the beginning. The Saurashtra peninsula, the Tapti valley, and the plains of Patan are the rest of Gujarat, and Gujarat is the richest land in India. The Company will have them all."
 
 mnd_maj_southern_colonies_title:0 "Colonies in the South"
 mnd_maj_southern_colonies_desc:0 "The winds of the southern ocean carry our ships beyond the known world. Sailors speak of a great cape at the bottom of Africa, and of a vast southern continent beyond it, untouched by any European flag. We must find them before our rivals do, for whoever charts the southern route will command the trade of two oceans."
 mnd_maj_voc_title:0 "The Vereenigde Euro-Balische Compagnie"
 mnd_maj_voc_desc:0 "A permanent charter is drawn up for a new company, the Vereenigde Euro-Balische Compagnie (VEC), with a monopoly on all trade between the Spice Islands, the Cape, and the markets of Europe. Its headquarters will be at the Cape of Good Hope, where its ships may water and resupply on the long voyage east."

 mnd_maj_australian_company_title:0 "The Holland Estate"
 mnd_maj_australian_company_desc:0 "The Bali-Dutch have established a presence in the southern lands, and it is our duty to secure our own foothold. The Holland Estate will serve as the base for our operations, ensuring that our influence extends across the new continent."
 
 gc_lus_discover_far_east_title:0 "The Lusitanian Venture"
 gc_lus_discover_far_east_desc:0 "Beyond Malacca lie islands no Portuguese has yet charted, the Philippines, where the Chinese trade for silver, and the coasts of South China, where the riches of Cathay wait behind the Emperor's gates. Our pilots must bring back charts before our ships can sail."
 lus_discover_philippines_tt:0 "We have discovered a province in the Philippines"
 lus_discover_south_china_tt:0 "We have discovered a province in South China"

 gc_lus_philippine_foothold_title:0 "A Foothold in Indo-China"
 gc_lus_philippine_foothold_desc:0 "The islands we charted are rich, divided, and defended by no one who matters. A single harbour, properly fortified and garrisoned, will be enough to open the silver trade, and to give our ships a base from which to command the eastern seas."
 gc_lus_macau_factory_title:0 "A Factory in Macau"
 gc_lus_macau_factory_desc:0 "The coasts of South China are rich and well-defended, but a single factory in Macau will allow us to tap into the lucrative trade with Cathay. Properly fortified and garrisoned, it will serve as our base for operations in the region."
 lus_owns_macau_tt:0 "We hold Macau"
 gc_lus_christian_macau_title:0 "A Christian Macau"
 gc_lus_christian_macau_desc:0 "The Jesuits have laboured in Macau for decades, and their work is complete. The Chinese merchants of the leased territory have accepted baptism, the churches outnumber the pagodas, and the mandarins have ceased to complain, for now. Macau is a Christian city on Chinese soil, and the tea it ships to Lisbon is grown by Christian hands."
 lus_macau_religion_tt:0 "Macau follows our state religion"
 gc_lus_jeju_base_title:0 "The Jeju Station"
 gc_lus_jeju_base_desc:0 "Off the southern coast of Korea lies a volcanic island with good anchorages and a sullen population. It is a perfect base, close to Japan, close to Korea, close to the Chinese trade routes. The King of Joseon will not sell it, but he will lose it."
 lus_owns_jeju_tt:0 "We hold Jeju"

 nov_ugric_conversion_title:0 "The Great Eastern Resettlement"
 nov_ugric_conversion_desc:0 "The Ugric tribes of the northern forests, the Merya, the Muroma, the Meshchera, and their kin, have dwelt in these lands since before the Rus' came. They pay tribute, they trade furs, but they do not speak our tongue and they do not worship our God. The princes of Yaroslavl have begun to settle them, to baptise them, and to make them Russians. It is a long work, but it will be finished."
 kok_mam_convert_egypt_title:0 "The Egyptian Nile"
 kok_mam_convert_egypt_desc:0 "The land of the Pharaohs has long been a crossroads of faiths, but now it is our mission to bring the light of our religion to its people. Temples will be built, priests will preach, and the people will be guided towards the true faith."

 gc_por_united_alliance_title:0 "The Tripartite Pact"
 gc_por_united_alliance_desc:0 "Three powers stand apart from the great game of Europe: Lusitania in the west, Bohemia in the heart of the Empire, and the Two Sicilies in the south. Bound by common interest rather than blood, they agree to stand together against any who would humble them, and to divide the spoils of Iberia between them."
 gc_por_intervene_in_balkans_title:0 "Intervene in the Balkans"
 gc_por_intervene_in_balkans_desc:0 "The Roman Empire of the East is a shadow of what it was. Its fleets rot in the Golden Horn, its themes have been parcelled out to warlords and priests, and its emperor rules over a city that no longer commands an empire. The Morea and the Greek mainland are ripe for the taking, and whoever takes them will command the eastern Mediterranean. That whoever will be us."
 por_byz_weakened_tt:0 "Byzantium does not control the Morea and Northern Greece"
 gc_por_lusitanian_empire_title:0 "The Lusitanian Empire"
 gc_por_lusitanian_empire_desc:0 "From the Tagus to the Atlas, from the Algarve to the Algerian coast, the whole of the western Mediterranean acknowledges Lusitanian rule. The Berber kings have been broken, the corsairs driven from their havens, and the mosques of the Maghreb are being rebuilt as churches. This is not a kingdom... this is an empire."
 gc_por_true_rome_title:0 "The True Rome"
 gc_por_true_rome_desc:0 "There are two Romes now: the ancient city on the Tiber, held by Anchovian hands, and the new Rome of the Atlantic, crowned in Lisbon. Only one of them can be the true seat of Christendom, and only one of them can crown an emperor. The Pope has waited in exile long enough. We will return him to his throne, and take his exile for ourselves."
 gc_por_papal_vassal_title:0 "The Pope in Our Pocket"
 gc_por_papal_vassal_desc:0 "The Holy Father has taken refuge in the Pyrenees, and he has nowhere else to go. Barcelona is ours, the passes around Andorra are ours, and the roads that bring supplies to the Papal court run through Lusitanian land. A Pope who depends on us for bread, silver, and protection is worth more than a Pope in Rome. Let him stay in his mountain refuge, as our chaplain."
 gc_por_third_rome_title:0 "Proclamation of the Third Rome"
 gc_por_third_rome_desc:0 "Two Romes have stood. The first fell to the barbarians, and the second to the Turk. But there is a third, and it is not Moscow as the Russians claim, it is Lisbon. Not because we hold Rome, but because we are the power that keeps Rome safe. Not because we replaced the Pope, but because we restored him. Not because we conquered the Church, but because we defend it with our fleets and our treasure.\n\nThe Holy Father sits in Rome under Lusitanian protection. The cardinals are elected from across Christendom, but the fleets that keep them safe fly the Lusitanian flag. The kings of Europe may grumble, but they know who holds the balance of faith in the west. Let the proclamation go out: Lusitania is the Third Rome, the shield of the Church, the empire of the true faith."
 gc_por_not_charlemagne_title:0 "Not Another Charlemagne"
 gc_por_not_charlemagne_desc:0 "In the year 800, the Pope crowned a Frankish king Emperor of the Romans, and for a thousand years every European monarch has dreamed of that moment a Pope, a crown, an empire. We have ended the dream. The Holy Father is ours. The cardinals answer to Lisbon. The Curia's authority is our authority, and when we speak in matters of faith, the kings of Europe listen not because we are crowned by Rome, but because Rome is crowned by us.\n\nLet Charlemagne keep his memory. Let the Holy Roman Emperor keep his empty title. Let the kings of France and Spain pretend their crowns are divine. We know who truly rules the Catholic world, and so does the Pope. Proclaim it, and let Europe tremble."

 alb_ash_and_ember_title:0 "The Ash and the Ember"
 alb_ash_and_ember_desc:0 "Alba is gone.\n\nThe great kingdom that once bound Ireland and Britain under one crown is a memory the old men tell to children who no longer believe it. It fell, not to a single blow, but to a long decay: rebellious lords, ambitious neighbours, a crown that spent too much and ruled too little. What was one kingdom is now a dozen fragments, each clinging to its own scrap of the old realm and calling itself a successor.\n\nWe are Albion. Of all the fragments, we are perhaps the strongest, though that is a sad thing to say of a realm that holds only Leinster, Ormond, and the midlands of Ireland; Wessex, London, the West Midlands, East Anglia, and a stretch of the eastern coast. It is a patchwork, not a kingdom. The lords of the north no longer send tribute. The Welsh marches ignore our writ. The old fleet rots at anchor and the old levies have gone home to their fields.\n\nBut we remember. The ash of Alba is still warm, and somewhere beneath it, an ember burns.\n\nBefore we can reclaim anything, before we can even speak of restoration, we must first rebuild the one thing that made Alba feared: its army. Fill the ranks. Call the levies. Bring our forces to nine-tenths of what our lands can support, and let the world see that Albion is not yet finished."
 alb_thames_secured_title:0 "The River and the Crown"
 alb_thames_secured_desc:0 "Lundain sits on the Thames like a crown on a king's head, but a crown can be taken. The estuary downstream is held by men who owe no loyalty to Albion, and every ship that passes Kent could carry an army instead of cargo. The old kings of Alba understood this: whoever holds the mouth of the Thames holds the city. Kent must answer to us before we can call the capital truly safe."
 alb_conquer_wales_title:0 "The Welsh Princes"
 alb_conquer_wales_desc:0 "Beyond the Severn lie the last of the old British kingdoms Gwynedd, Powys, Deheubarth. They call themselves princes, and they answer to no crown but their own. They have watched us for a century, waiting for a sign of weakness. Instead they will see the banner of Albion raised over their halls. The Welsh will not be conquered as the Saxons were; they will be welcomed home."
 alb_conquer_ireland_title:0 "The Old Heartland"
 alb_conquer_ireland_desc:0 "Ireland was the first home of Alba. Before there were kings in Londinium, there were kings in Tara and it was in Ireland that the old kingdom was born. For too long it has been divided among chieftains who call themselves kings and sheikhs who call themselves lords. It is time for the heartland to return to the crown."
 alb_reform_alba_title:0 "Alba Restored"
 alb_reform_alba_desc:0 "Ireland is ours. Wales is ours. The Thames is ours. The kingdom that fell a century ago stands once more, whole and entire. Londinium, Lundain, has grown into a capital worthy of the name. And the crown that has waited so long in the shadows of the old palace at last puts on its ancient name. We are no longer a fragment. We are Alba.\n\nThe old kings are watching. Let them see."
 alb_follow_old_faith_title:0 "Following the Old Faith"
 alb_follow_old_faith_desc:0 "Rome never forgave us for what we were before it came. Long before the legions, long before the bishops, the faith of these islands was simpler, scripture in our own tongue, priests who answered to no distant throne, and a God who spoke in the language of the people. The Lollards of England kept that old flame alive, and when they were burned for it, they fled west. Now their heirs sit in our halls, and the crown has a choice: keep the Roman peace, or take up the faith our fathers held before Rome ever set foot here.\n\nThe bards have made their choice. The Church will follow."
 alb_oxford_studies_title:0 "The Oxford Studies"
 alb_oxford_studies_desc:0 "Oxford is not a great city. It is not a great port. It has no cathedral worth the name, no palace worth visiting, and its wool trade is respectable rather than remarkable. But Oxford has something the rest of the kingdom lacks: scholars. The monks of Oseney, the masters of the schools, the clerks who copy manuscripts by candlelight and argue about Aristotle at dawn, they are here, they have always been here, and the crown has begun to notice them.\n\nA king who is remembered is a king who founded something that outlasts him. A college, an endowment, a library that will bear his name for a thousand years. The court is beginning to think that way. Develop Oxford. Endow it. Make it a place the world will look to and the world will look to Alba in turn."
 alb_church_lands_title:0 "The Temples of the Realm"
 alb_church_lands_desc:0 "The old faith has returned to Alba, and with it the question of who holds the land. For a century the nobility have owned the fields and the villages, and the church has been a tenant in its own country. No longer. The crown will endow new parishes, restore old ones, and place the tithes and glebe lands under the protection of the bishops once more. The lords will not like it. The bishops will."
 alb_grand_navy_title:0 "The Grand Navy"
 alb_grand_navy_desc:0 "Alba is an island, two islands, if we count Ireland, and no island kingdom has ever survived on its army alone. The old kings of Alba understood this: their fleets carried their armies to Ireland, kept the Norse out of the Irish Sea, and held the Channel against every rival that ever challenged them. We have the shipyards. We have the timber. We have the sailors, and the coin to pay them. What we do not yet have is a fleet worthy of the name.\n\nBuild it. One great ship as flagship, and twenty more to serve her. Let the world see that Alba has returned to the sea."
 alb_imperial_shores_title:0 "The Imperial Shores"
 alb_imperial_shores_desc:0 "The old kings of Alba believed the world ended at the western sea. They were wrong. Ships have returned from beyond the horizon bearing tales of vast continents no European has ever charted, empty shores, endless forests, and rivers wide enough to swallow the Thames. The Iberians have already planted their flags. The Franks and the English are following. If Alba is to remain a kingdom worth the name, we must be there too.\n\nSend the ships. Plant the flag. Claim a shore of our own before the age closes."
 alb_jewel_of_channel_title:0 "The Jewel of the Channel"
 alb_jewel_of_channel_desc:0 "The Channel has always been the lifeblood of Alba. Control of its waters ensures the safety of our coasts, the prosperity of our ports, and the projection of our power abroad. The old kings understood this, and so must we. Fortify the harbours, build the ships, and let the world know that the Jewel of the Channel belongs to Alba."
 alb_red_coats_title:0 "The Red Coats"
 alb_red_coats_desc:0 "The soldiers of Alba have long been known for their discipline and courage, but the world is changing. To maintain our place among the great powers, we must modernize our army, equip it with the latest uniforms and weapons, and instill in every man the pride of serving the crown. The red coats will be a symbol of Alba's strength and resolve."
 alb_rock_of_europe_title:0 "The Rock of Europe"
 alb_rock_of_europe_desc:0 "Brittany is not France, whatever the French kings may claim. Its people speak a Celtic tongue older than the Roman conquest. Its saints are the saints of Ireland and Wales. Its sailors have fished the Atlantic since before there were kings in Paris. When the Britons fled the Saxon invasions, they did not vanish, they crossed the sea and made a new home on the far shore. They are our cousins, however long we have been apart.\n\nAnd they hold the finest harbours in the western approaches. Brest, Saint-Malo, Nantes, the gateways to the Channel and the Atlantic beyond. Whoever holds Brittany holds the western sea. That must be us."
 alb_channel_trade_title:0 "The Narrow Sea Trade"
 alb_channel_trade_desc:0 "Control of the Narrow Sea is not just a matter of military power; it is the key to our economic strength. Alba's merchants must dominate the trade routes that pass through these waters, ensuring that the wealth of the western seas flows into our ports. Fortify the harbours, protect the convoys, and let the world know that the Narrow Sea belongs to Alba."
 alb_bohemian_question_title:0 "The Bohemian Question"
 alb_bohemian_question_desc:0 "The Kingdom of Bohemia has long held Hadrions wall, and Kent. Alba must decide whether to press its claims diplomatically or through force, balancing the interests of the crown with the realities of Bohemian power."
 alb_first_act_title:0 "The Act of Crown and Parliament"
 alb_first_act_desc:0 "A bill formalising the relationship between Crown and Parliament, and confirming the rights and privileges of both."
 alb_great_matter_title:0 "The Great Matter"
 alb_great_matter_desc:0 "The issue of Alba and the Lollard Church has reached an important point. The kingdom must navigate the delicate balance between religious reform and royal authority, ensuring that the crown's interests are protected while addressing the concerns of the faithful."
 alb_civil_war_title:0 "The State of the Nation"
 alb_civil_war_desc:0 "The kingdom is facing internal strife, with factions vying for power and influence. The crown must navigate these turbulent times carefully, balancing the demands of the nobility, the church, and the common people to maintain stability and unity within Alba."
 alb_standing_army_title:0 "The Standing Army"
 alb_standing_army_desc:0 "The crown has decided to maintain a permanent, professional army to ensure the security of Alba. This standing force will be well-trained, well-equipped, and ready to respond to threats both at home and abroad, reflecting the kingdom's commitment to military preparedness and national defense."
 alb_expand_parliament_title:0 "The Expansion of Parliament"
 alb_expand_parliament_desc:0 "The powers and influence of Parliament have been expanded, allowing for greater participation in the governance of the kingdom and ensuring a more balanced relationship between the Crown and the legislative body."
 alb_republic_of_virtue_title:0 "The Republic of Virtue"
 alb_republic_of_virtue_desc:0 "The kingdom has embraced the principles of civic virtue and republican governance. Alba seeks to cultivate a society where citizens are actively engaged in public life, and the government operates with transparency, accountability, and a commitment to the common good."
 alb_settled_crown_title:0 "The Settled Crown"
 alb_settled_crown_desc:0 "The crown has established a stable and enduring presence, consolidating its authority and ensuring the continuity of governance. This settled state allows Alba to focus on long-term development and the well-being of its people."