l_english:
 german_kingdom:0 "Proud Germanic State"
 german_kingdom_desc:0 "After the great success of germanization policy in Bohemia it's time we enforce it in all of our empire."

 soldier_king:0 "The Soldier-King of Bohemia"
 soldier_king_desc:0 "Most states are countries that have an army, Bohemia on the other hand is an army that has a country. The many Kings of Bohemia were as much soldiers as they were Monarchs, and each would end their reign not only having reformed the state but also having left their mark on the army."

 tsushima_shogunate_ideas:0 "Tsushima Shogunate Ideas"
 tsushima_shogunate_ideas_start:0 "Tsushima Shogunate Traditions"
 hjo_legacy_of_the_tsushima_shogunate:0 "Legacy of the Tsushima Shogunate"
 hjo_legacy_of_the_tsushima_shogunate_desc:0 "Despite the weakkening of our power, the Tsushima family name holds great sway among the noble families of the realm. We must continue to honor our ancestors and their legacy, and ensure that the Tsushima name remains a symbol of strength and leadership for generations to come."

 hjo_castles_of_kanto:0 "Castles of Kanto"
 hjo_castles_of_kanto_desc:0 "The great castles left from the time of the united shogunate protect us still. We must rennovate them to ensure they continue their usefullness in the future."