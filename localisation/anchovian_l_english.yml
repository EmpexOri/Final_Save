 nap_new_anchovia:0 "The Anchovian Empire"
 nap_new_anchovia_desc:0 "Anchovia has been raised to imperial dignity. Its ruler sits as a peer of the Holy Roman Emperor and the Ottoman Sultan, and its parliament gives voice to the realm."

 anchovian_empire_reform:0 "Anchovian Imperium"
 anchovian_empire_reform_desc:0 "Anchovia is not merely a kingdom. It is an imperium of the middle sea a state that commands the central Mediterranean from the Adriatic gate to the Libyan shore. Its ruler is no longer a mere king, but the sovereign of an imperial domain."
 