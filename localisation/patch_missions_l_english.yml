 pharaoh_rule:0 "Pharaonic Egypt"
 pharaoh_rule_desc:0 "Pharaoh rules as the son of the gods."

 kok_mam_holy_cities_title:0 "The Pharaoh's Cities"
 kok_mam_holy_cities_desc:0 "Our holy cities, blessed by the Pharaoh, are the center of our spiritual and political power. We must reclaim and develop them to ensure the prosperity of our realm."
 egy_sinai_title:0 "The Sinai Peninsula"
 egy_sinai_desc:0 "The Sinai Peninsula is a land of strategic and spiritual importance. We must secure and develop it to strengthen our realm and protect our holy sites."
 mam_incense_trade_title:0 "The Incense Road"
 mam_incense_trade_desc:0 "The old gods demand their offerings. Frankincense and myrrh from the far south must flow through our ports, as they did in the days of the old pharaohs. Alexandria, Damietta, and Suez, the three gates of Egypt, must all serve the incense road once more."

 emp_nap_egyptian_trade_title:0 "The Egyptian Connection"
 emp_nap_egyptian_trade_desc:0 "The spice trade flows through Alexandria, and whoever holds the favour of the Sultan holds the keys to the East. We must cultivate a lasting relationship with Egypt, one that fills Anchovian coffers with the wealth of Arabia."
 emp_nap_egyptian_alliance_title:0 "The Alexandrian Pact"
 emp_nap_egyptian_alliance_desc:0 "Alexandria is the hinge of the eastern Mediterranean. If Egypt holds the city and stands with us, the spice road flows west into Neapolitan hands. A formal pact binds us both, their armies grow sharper, our merchants grow richer."
 emp_nap_adriatic_gate_title:0 "The Adriatic Gate"
 emp_nap_adriatic_gate_desc:0 "Whoever holds both shores of the Strait of Otranto holds the keys to the Adriatic. The Albanian coast has been contested for centuries, between Angevins, Venetians, and Ottomans. We will be the ones to keep it. From Durrës to Vlora, the strait will be ours, and no fleet will pass into the Adriatic without our leave."

 kok_mam_subjugate_beyliks_title:0 "Subjugate the Beyliks"
 kok_mam_subjugate_beyliks_desc:0 "The Turkish Beyliks of Anatolia have paid us tribute in the past and acknowledged our overlordship. Now they have delusions of independence despite the mighty Ottoman Sultan breathing down their necks. It is time to reassert our power in Anatolia."