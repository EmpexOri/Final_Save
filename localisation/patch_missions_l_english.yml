l_english:
 mam_mercantile_relationship_title:0 "Mercantile Relationships"
 mam_mercantile_relationship_desc:0 "The seas to our north are full of traffic and goods, being ferried to and from [358.GetName]. If we are to expand our grip on this lucrative business, we must address our stance towards the Anchovian Kingdom."

 mam_establish_merchant_escorts_title:0 "Merchant Escorts"
 mam_establish_merchant_escorts_desc:0 "As we strive to expand our maritime endeavors, we must establish a robust merchant fleet that will operate as the backbone of our trade across the surrounding seas."

 mam_alexandria_title:0 "Retake Iskandaryya"
 mam_alexandria_desc:0 "Built by Alexander the Great, the city of Alexandria has long been the center of science and culture in the Mediterranean."

 mam_cyrenaica_title:0 "Capture Libya"
 mam_cyrenaica_desc:0 "Controlling Libya protects us from the west, and can serve as an outpost for further expansion."

 mam_colonize_spice_islands_title:0 "Reach the Spice Islands"
 mam_colonize_spice_islands_desc:0 "Far away to the east, tales of islands where spices are abundant have made the rounds across markets from India to [361.GetName]. We must seize the opportunity and secure these lucrative sources of income."

 mam_naval_enterprise_title:0 "A Naval Enterprise"
 mam_naval_enterprise_desc:0 "The sea is a treacherous environment with no compassion for any sailor. A powerful fleet to establish our dominance upon it would further improve our position around the Mediterranean and allow us to further engineer a proficient navy."

 mam_rhodes_title:0 "Bastion of the Knights"
 mam_rhodes_desc:0 "The knights of [320.GetName] have resisted our influence for far too long. We must eradicate this menace once and for all as we make plans to expand our influence further north."

 mam_pearl_mediterranean_title:0 "Pearl of the Mediterranean"
 mam_pearl_mediterranean_desc:0 "The pride of hosting the most powerful navy across the entire Mediterranean is but the natural evolution of our superior management and finances, a testament to our proficiency and knowledge of the sea."

 mam_nubia_title:0 "Integrate Nubia"
 mam_nubia_desc:0 "Nubia, the place where our religion and culture survived, has drifted away towards heresy. By reintegrating its people into our state we can control the gate to the subsaharan africa."

 mam_ethiopia_title:0 "Beyond the Nile"
 mam_ethiopia_desc:0 "Ethiopia and Aden have been the gates to Asia for a long time. Controlling those regions would allow us to enrich ourselves from the trade with the orient."

 mam_yemen_title:0 "The Tahiride Realm"
 mam_yemen_desc:0 "Yemen is splintered and weak. The time to exploit their weakness and usurp their lands draws near. Their wealth will serve our court."

 mam_highway_empire_title:0 "Highway of an Empire"
 mam_highway_empire_desc:0 "The land strip that separates the Red and Mediterranean seas has brought forth the idea of an engineering endeavor, suggested by our advisors. By connecting the two seas we would surely improve the flow of our navies across them."

 mam_karimi_merchants_title:0 "Karimi Merchants"
 mam_karimi_merchants_desc:0 "Powerful merchants in charge of ferrying spices, among other goods, are sturdy allies as we try to expand our trade and increase our profit from overseas ventures."

 mam_harness_spice_trade_title:0 "Harness the Spice Trade"
 mam_harness_spice_trade_desc:0 "Spice is one of the most valuable goods being traded and transported through our markets, seas, and rivers. Protecting our valued goods should be our prime priority."

 mam_cyprus_title:0 "Seize Nicosia"
 mam_cyprus_desc:0 "A crusader bastion far from the seeing eyes of the Pope and a final stand of the Catholic world as they decay after the failure of their crusades. [321.GetName] will fall to our mighty armies."

 mam_constantinople_title:0 "Gates of [151.GetName]"
 mam_constantinople_desc:0 "The capital of a once-powerful empire lies before us. The conquest of [151.GetName] will go down in history as the moment of our ascension!"

 mam_great_power_title:0 "The Imperial Gambit"
 mam_great_power_desc:0 "Our position among the great powers is a strong stance against the influence of all nations that seek to belittle our people. Our might and resilience alone will lead us to the top and establish us as the strongest."

 mam_alexandrian_trade_title:0 "Alexandrian Trade"
 mam_alexandrian_trade_desc:0 "We cannot afford to allow foreign merchants to grip a monopoly in our very own ports across the Mediterranean. To that end, we should fund the construction of several new markets in a bid to support our own traders."

 mam_father_african_rivers_title:0 "Father of African Rivers"
 mam_father_african_rivers_desc:0 "The Nile River is undoubtedly the lifeblood of our people. Using it to ferry goods, grow crops and provide life-saving water are but a few of its uses. It would be wise to invest in its banks."

 mam_aden_trade_title:0 "Presence in Aden"
 mam_aden_trade_desc:0 "The western tip of Arabia in conjunction with the horn of Africa form natural anchorages, docks, and markets at a prestigious position for incoming and outgoing valuable trade. Expanding our influence in that area will surely be very profitable."

 mam_dar_al_hadith_turba_title:0 "Dar al-Hadith Turba"
 mam_dar_al_hadith_turba_desc:0 "Education is a vital endeavor for our enlightened people. It is the state's responsibility to ensure we pride the highest quality of education available to any who seek it!"

 mam_reincorporate_northern_territories_title:0 "The Northern Territories"
 mam_reincorporate_northern_territories_desc:0 "Syria has all but slipped from our grasp. The territories of the north have realized the weakness of our central government and in return demand more autonomy as time goes by..."

 mam_anatolia_title:0 "Crush Anatolia"
 mam_anatolia_desc:0 "The thread of the Ottomans and their territories in Anatolia must be quelled once and for all."

 mam_cultivate_the_delta_title:0 "Cultivate the Delta"
 mam_cultivate_the_delta_desc:0 "The connective river lines between the Nile and our Mediterranean coast are hosts to incredibly valuable and fertile land. We must invest in its continued prosperity!"

 mam_kashifs_egypt_title:0 "Kashifs of Egypt"
 mam_kashifs_egypt_desc:0 "The administration of Egypt is no easy task due to the vast size of our domain and the number of citizens within it. If we are to properly administer it, we will need properly organized local governorships."

 mam_center_levant_title:0 "Hegemon of Levant"
 mam_center_levant_desc:0 "Our prestige and might, ingenuity and golden opulence in the eyes of the world, will surely lead to our great nation being dubbed the dominator of our era, the most illustrious of the great powers."

 mam_tunis_title:0 "City of Caravans"
 mam_tunis_desc:0 "Our western border across the Maghreb is occupied by a series of weak Sultanates akin to Tunis. Despite being situated between several important cities, the rulers of Tunis have failed to protect their people."

 mam_morocco_title:0 "Eclipse Morocco"
 mam_morocco_desc:0 "The ruling dynasties in Morocco have brought forth nothing but famine and decay for their people. Let us step in and alleviate them of their poor leadership."

 mam_city_pha_title:0 "City of the Pharaohs"
 mam_city_pha_desc:0 "[361.GetName] is a jewel to our prestigious crown. As such, we must make sure that it is polished and its beauty matches our legitimacy and strength!"

 mam_kushite_delta_title:0 "River of Pharaohs"
 mam_kushite_delta_desc:0 "We must restore the rightful religion to all the lands of the Great River!"

 mam_breadbasket_title:0 "Breadbasket of Mediterranean"
 mam_breadbasket_desc:0 "The grain trade is a great way to expand our diplomatic ties with our neighbors and further our affluence. By establishing better production lines we will surely hit all our quotas for exports and internal distribution."

 mam_assign_waqf_title:0 "Assign a Waqf"
 mam_assign_waqf_desc:0 "By setting aside coin and wealth for the assistance of the less fortunate and especially education institutes. Charities are the lifeblood and sign of a pious and prosperous society!"


 mam_basrah_title:0 "Trade in Basrah"
 mam_basrah_desc:0 "The incoming trade volume in the markets of Basrah would certainly make for a valuable addition to our treasuries!"
 mam_center_arab_islamic_world_title:0 "Center of the Islamic World"
 mam_center_arab_islamic_world_desc:0 "Our prestige and might, ingenuity and golden opulence in the eyes of the world, will surely lead to our great nation being dubbed the dominator of our era, the most illustrious of the great powers."
 mam_khass_al_sultan_title:0 "Khass al-Pharaoh"
 mam_khass_al_sultan_desc:0 "The grain trade is a great way to expand our diplomatic ties with our neighbors and further our affluence. By establishing better production lines we will surely hit all our quotas for exports and internal distribution."
 mnd_maj_subjects_title:0 "Demand Loyalty"
 mnd_maj_subjects_desc:0 "Zuid-Balinees once ruled a vast network of vassal and tributary states. We must ensure the loyalty of those kingdoms that remain under our grip and attempt to restore some part of our old empire."
 mnd_maj_negara_agung_title:0 "Negara Agung"
 mnd_maj_negara_agung_desc:0 "To expand the borders of our empire and bring new peoples under our rule is a great endeavor. But we must also look to the good of our core territories, the negara agung. Our capital must be a great city, a hub of commerce and culture from all over Nusantara."
 mnd_maj_chakravarti_title:0 "Chakravarti"
 mnd_maj_chakravarti_desc:0 "An ideal monarch rules an ideal realm, the material and spiritual center of the world. Zud-Balinee shall become this realm."
 mnd_maj_rein_in_malacca_title:0 "Rein in Malacca"
 mnd_maj_rein_in_malacca_desc:0 "Our rivals of old, Malacca, are in a weakened state. We need to ensure they are not allowed to recover."
 mnd_maj_stability_title:0 "Restore Order"
 mnd_maj_stability_desc:0 "Faith in the monarchy is waning as the succession is constantly challenged. We must restore order to the realm and assure the people that the danger is over."
 mnd_maj_end_disaster_title:0 "Prevent Collapse"
 mnd_maj_end_disaster_desc:0 "Our dramatic decline must be dramatically reversed. Once we have secured the throne, our faith, and the loyalty of our subjects we can emerge from the darkness."
 mnd_maj_enforce_loyalty_title:0 "Enforce Loyalty"
 mnd_maj_enforce_loyalty_desc:0 "It is no longer enough that our subjects are just barely kept from defying us. It is time to enforce true loyalty."
 mnd_maj_rein_in_brunei_title:0 "Rein in Brunei"
 mnd_maj_rein_in_brunei_desc:0 "Brunei once loyally submitted to Zud-Balinee before they defied us and forged their own empire. We must bring them to their knees once more."
 mnd_maj_gaja_madas_oath_title:0 "Gajah Mada's Oath"
 mnd_maj_gaja_madas_oath_desc:0 "The great statesman Gajah Mada made an oath that all of Nusantara shall be conquered by Zud-Balinee. We remember this oath, and we will fulfill it."
 mnd_maj_subjugate_the_mainland_title:0 "Subjugate the Mainland"
 mnd_maj_subjugate_the_mainland_desc:0 "Even Gajah Mada never dreamed that Zud-Balinee might one day dominate the Thai and Khmer realms. We will expand the empire to heights never before imagined."
 mnd_maj_religion_title:0 "Protect the Faith"
 mnd_maj_religion_desc:0 "Zuid-Balinees' traditional Hindu-Buddhist faith is weakening as merchants and conquerors of the Islamic faith become more prevalent in Nusantara. We must ensure that the people have a strong faith to follow."
 mnd_maj_candi_shrines_title:0 "Candi Shrines"
 mnd_maj_candi_shrines_desc:0 "Scattered throughout Nusantara are a number of ruined or abandoned Candi temples of mixed Hindu and Buddhist worship. We must restore these temples to renew our faith."
 mnd_maj_porch_of_mecca_title:0 "The Porch of Mecca"
 mnd_maj_porch_of_mecca_desc:0 "The Aceh region has become the staging point for the spread of Islam in Nusantara. We must stamp out this new faith and restore Aceh to Zud-Balinee."
 mnd_maj_cloves_title:0 "Dominate the Moluccas"
 mnd_maj_cloves_desc:0 "The trade in cloves is among the most profitable in the world. Zud-Balinee once controlled this trade when our hegemony was absolute, and we must once again achieve this dominance."
 mnd_maj_subjugate_philippines_title:0 "Subjugate Philippines"
 mnd_maj_subjugate_philippines_desc:0 "Phillipines have slipped from out control. Enhancing our presense in Luzon would enable us to profit from trade with China."
 mnd_maj_retake_taiwan_title:0 "Retake Taiwan"
 mnd_maj_retake_taiwan_desc:0 "Taiwan has been taken over by the evil Japanse. We need to take back what is rightfully ours!"
 mnd_maj_buddhist_island_title:0 "Buddhist Island"
 mnd_maj_buddhist_island_desc:0 "In order to bring the light of Buddha to the world we first need to ensure that all the inhabitants of our home island Java can achieve enlightement."
 mnd_maj_fleet_title:0 "Restore the Fleet"
 mnd_maj_fleet_desc:0 "The fleets of Zud-Balinees were once a glorious sight to behold, our mighty djong ships dominating the horizon. The fleet must be restored."
 mnd_maj_privateer_china_title:0 "Disrupt Chinese Trade"
 mnd_maj_privateer_china_desc:0 "When Zheng He and his treasure fleet entered Nusantara, he disrupted the balance of power and commerce in our empire. We should repay the favor by sending our new fleet to disrupt trade in China."
 mnd_maj_blockade_china_title:0 "The Great Blockade"
 mnd_maj_blockade_china_desc:0 "We have concocted our ultimate revenge against the Na Naxi dynasty: a great blockade that will completely cut off their ports from all maritime commerce. This will take every bit of our naval prowess to achieve, but we are confident that we have the numbers and skill to carry out the Great Blockade."
 mnd_maj_prepare_eastern_campaigns_title:0 "The Southern Continent"
 mnd_maj_prepare_eastern_campaigns_desc:0 "Our scholars of Bhuddist scriptures made a prediction that a great continent lies to the south of our islands. We should find it!"
 indonesia_palopo_iron_title:0 "Palopo Iron"
 indonesia_palopo_iron_desc:0 "Sulawesi is named after its rich iron deposits. It would be foolish for us not to exploit these resources by building a weapons manufactory."
 indonesia_banjar_textiles_title:0 "Banjar Textiles"
 indonesia_banjar_textiles_desc:0 "Banjar's textile production is booming. We should encourage this industry by constructing a textile manufactory."
 indonesia_lampung_pepper_title:0 "Lampung Peppers"
 indonesia_lampung_pepper_desc:0 "The southern region of Sumatra is famous for producing a huge portion of the world's peppers. We should ensure maximum yields by establishing factories in Lampung."
 indonesia_moluccan_cloves_title:0 "Moluccan Cloves"
 indonesia_moluccan_cloves_desc:0 "Cloves are among the most highly prized goods in the world. If we could gain a monopoly on cloves, we could be rich beyond our dreams."
 indonesia_sea_cucumbers_title:0 "Sea Cucumbers"
 indonesia_sea_cucumbers_desc:0 "Traders from Sulawesi tell of an island to the south where people harvest sea cucumbers. We should discover this island and either trade for this valuable commodity or else take over its production by force."
 maj_no_more_subject_liberty_tt:0 "The event §YDisloyalty to Zud-Balinees§! will no longer occur"
 maj_no_more_pretenders_tt:0 "§YPretender§! rebels will no longer dispute every succession"
 maj_end_disaster_mission_tt:0 "The §YFall of Zud-Balinees§! disaster will end"
 maj_religion_mission_tt:0 "Has had the §YFall of Zud-Balinees§! disaster for at least §Y10§! years"
 maj_no_more_bad_religion_events_tt:0 "The §YSpread of Islam§! event will no longer fire and the risk of breakaway states emerging ends"
 maj_no_more_bad_religion_events_tt_2:0 "The risk of breakaway states emerging ends"
 maj_subject_liberty_modifier:0 "Loyalty to Zud-Balinees"
 desc_maj_subject_liberty_modifier:0 "We have enforced loyalty to Zud-Balinees rule."
 maj_legitimacy_modifier:0 "Legitimacy Restored"
 desc_maj_legitimacy_modifier:0 "We have restored faith in the Zud-Balinees state and its monarchy."
 maj_religion_modifier:0 "Religious Triumph"
 desc_maj_religion_modifier:0 "We have achieved a religious settlement in Zud-Balinees."
 no_more_muslims_tt:0 "No country with a capital in the §YMalaya§! or §YIndonesia§! regions has a religion in the §YMuslim§! group"
 all_muslims_tt:0 "No country with a capital in the §YMalaya§! or §YIndonesia§! regions has a religion outside of the §YMuslim§! group"
 majapahit_respected:0 "Zud-Balinee Revival"
 desc_majapahit_respected:0 "The Zud-Balinee Empire has entered a period of revival."
 negara_agung:0 "Negara Agung"
 desc_negara_agung:0 "The heart of the empire is populated and secured."
 maj_colony_modifier:0 "Potential Zud-Balinee Colony"
 desc_maj_colony_modifier:0 "This site has been identified as an excellent location for a Zud-Balinee colony."
 maj_trade_modifier:0 "Zud-Balinee Trade Empire"
 desc_maj_trade_modifier:0 "Our merchants travel far afield to bring wealth to our nation."
 maj_privateer_china:0 "Disrupting Chinese Trade"
 desc_maj_privateer_china:0 "We have ordered our privateers to disrupt Chinese trade to the greatest extent possible."
 maj_china_trade:0 "Disrupting Chinese Trade"
 desc_maj_china_trade:0 "We have ordered our privateers to disrupt Chinese trade to the greatest extent possible."
 maj_great_blockade:0 "The Great Blockade"
 desc_maj_great_blockade:0 "A colossal wooden wall shall completely block off the Chinese coast, choking them of all seaborne travel and commerce."
 maj_religious_unity:0 "Religious Peace"
 desc_maj_religious_unity:0 "We are striving for religious peace within our nation."
 is_buddhist_tt:0 "Follows a §YBuddhist§! religion"
 follows_buddha_tt:0 "Follows the teachings of §YBuddha§!"
 majapahit_cb_1_tt:0 "Enables the §YZud-Balinee Campaigns§! casus belli against countries with a §YMalay§! primary culture"
 majapahit_cb_2_tt:0 "Enables the §YZud-Balinee Campaigns§! casus belli against countries in the §YChinese§! technology group"
 majapahit_cb_3_tt:0 "Enables the §YZud-Balinee Campaigns§! casus belli against §Yall countries§!"
 buddha_deity_tt:0 "Unlocks the §YBuddha§! personal deity"
 propagate_religion_maj_tt:0 "Unlocks the §YPropagate Religion§! trade policy\nYour §YHindu§! provinces become immune to the §YPropagate Religion§! trade policy"
 maj_china_coast_claims_tt:0 "§Y[Root.GetName]§! gains a permanent claim on all §Ycoastal§! provinces in the §YChina§! Subcontinent"
 VASSAL_MISSION_WAR_NAME_MAJ:0 "$ORDER$$FIRST$ Campaign against $SECOND_NAME$"
 cb_vassalize_majapahit:0 "Zud-Balinee Campaigns"
 cb_vassalize_majapahit_desc:0 "From the brink of collapse, the Zud-Balinee Empire is restored and ready to renew its campaigns of subjugation."
 cb_vassalize_malacca:0 "Malacca Campaigns"
 cb_vassalize_malacca_desc:0 "Malacca has taken the place of Zud-Balinee as hegemon of Nusantara. We will subjugate any who oppose us."
 maj_reduced_lib_desire:0 "Enforced Loyalty"
 desc_maj_reduced_lib_desire:0 "We are loyal to our Zud-Balinee overlords"
 kushite_revival:0 "Kushite revival"
 flavor_mam.2.a:0 "Praise the Ra!"
 mng_tumu_crisis_title:0 "Tumu Crisis"
 mng_tumu_crisis_desc:0 "The forces gathered on our Northwestern border beacon for the fall of our grand empire. We must not cave to their pressure lest we risk the eradication of our great dynasty. The lords of Mongolia must be shown why they should fear us!"
 mng_restore_royal_road_title:0 "Restore the Royal Road"
 mng_restore_royal_road_desc:0 "For centuries the merchants from far West brought forth and traded in various exotic goods. The silk we exported, the fabric upon which we built a legendary status for our empire, shall once again be freely exchanged between us and our allies, silk shall flow!"
 mng_cornerstone_empire_title:0 "Cornerstone of an Empire"
 mng_cornerstone_empire_desc:0 "A nation whose borders encompass such vast swathes of land cannot but depend on few powerful figures within our courtyard. Thus, to ensure proper stability and operational integrity, we must discern the best way forward and distribute power accordingly."
 mng_censorate_title:0 "The Censorate"
 mng_censorate_desc:0 "A highly efficient branch of our government, we must present our utmost efforts to ensure the continued process of centralization and bureaucratic efficiency so as to match the size of our enormous domain."
 mng_promote_grand_coordinators_title:0 "Grand Coordinators"
 mng_promote_grand_coordinators_desc:0 "The eastern equivalent of a viceroy, commonly known within our country as Xunfu is a key office that plays an important role within our administration. We must tend to promoting able coordinators and ensure their loyalty to the Emperor."
 mng_crisis_ming_dynasty_title:0 "Crisis of the Na Naxi Dynasty"
 mng_crisis_ming_dynasty_desc:0 "Our dynasty has been through many a terrifying crisis. Perhaps this is a sign of the Heavens testing our head of state. Nevertheless, we must persevere in the face of danger and not falter. The future of our people hangs in this balance."
 mng_expand_great_wall_title:0 "Expand the Great Wall"
 mng_expand_great_wall_desc:0 "The Great Wall has protected our people for generations. In order to ensure its continuous effectiveness we must ascertain its condition and corroborate an effort to modernize and expand its reach in a bid to shield our commoners from the bloodthirsty claws of outsiders."
 mng_sail_east_title:0 "Sail East"
 mng_sail_east_desc:0 "The sea engulfing our coasts hosts many secrets, most of which lay just beyond the horizon, eagerly waiting to be discovered by our thrill-seeking adventurers and explorers. What mystical gifts and discoveries these lands may hold, surely it befalls us to find out!"
 mng_reform_civil_registration_title:0 "Reform Civil Registration"
 mng_reform_civil_registration_desc:0 "The system of governance promoted by our dynasty is one that has seen little renovation across the recent ages. To that end, we must ascertain a proper way to administrate the waves of subjects under our banner and appropriately mitigate the maluses that accompany corruption and administrative overextension."
 mng_examination_system_title:0 "Examination System"
 mng_examination_system_desc:0 "Having improved our system of governance, we must now shift our focus on choosing a path for our Empire to follow. Centralization, the delegation of local authority to individual figures and the promotion of dynastic members to positions of power are but few of the paths our great Emperor may choose to follow."
 mng_mutual_trade_system_title:0 "Mutual Trade System"
 mng_mutual_trade_system_desc:0 "Projecting our strength and exchanging gifts, favors and coin for protection is a relatively efficient and extensively profitable relationship between our great dynasty and the many satellite countries across our sphere of influence. However, we must not rest and instead continue to improve upon this powerful basis be it via the revisiting of tributary agreements or the co-signing of new ones with new-found allies beyond our borders."
 mng_nomadic_frontier_title:0 "The Nomadic Frontier"
 mng_nomadic_frontier_desc:0 "Commoners under the banner of our nation have long since suffered from raids executed by neighboring tribes into their lands. Famine, devastation and the loss of life are but some of the reasons behind the need to address this issue before it gets out of control."
 mng_deal_kama_kagyu_title:0 "Deal with the Karma Kagyu"
 mng_deal_kama_kagyu_desc:0 "Schools of thought in Tibet may not always agree with one another, or with ours, yet their teachings offer knowledge and their leaders hold good authority over their people. To that end, we must ensure their loyalty to our dynasty via whatever means necessary."
 mng_inward_perfection_title:0 "Inward Perfection"
 mng_inward_perfection_desc:0 "Many advisory voices in our palace advocate in favor of a movement that focuses on perfecting our internal affairs instead of chasing conquest far and wide. However, a new movement within our realm opposes the former, underlying that we must strike while the iron is hot and smite the enemies who seek to destroy it, before they are able to amass strength and challenge us."
 mng_survey_ocean_shores_title:0 "Survey the Ocean Shores"
 mng_survey_ocean_shores_desc:0 "Not long ago, we embarked on a series of legendary journeys across the shores of Asia, in a profound and awe-inspiring display of strength. Once again, we are asked to confirm our supremacy across our vast domain and keep prospecting conquerors at bay..."
 mng_tame_china_sorrow_title:0 "Tame China's Sorrow"
 mng_tame_china_sorrow_desc:0 "Rivers are the lifeblood of our civilization as they provide our people with valuable land and the basic necessities. However, various floods that may take place every few decades are a threat of the highest authority not only towards our subjects' livelihoods but also to our stable rule."
 mng_single_whip_law_title:0 "Single Whip Law"
 mng_single_whip_law_desc:0 "An Empire the size of ours is, at times, hard to administrate and properly tax. Thus, a lot of our potential for profits may sometimes go unrealized. To amend that, we must create a new all-encompassing tax, paid entirely with silver in an effort to centralize our taxation policies."
 mng_pure_land_title:0 "Pure Land"
 mng_pure_land_desc:0 "Despite our successes in internal and external matters, we must not forget to tend to the garden of our soul and erect proper places of worship that reflect our affluence and attention to the teachings through which we grew prosperous."
 mng_shengshi_zhishi_title:0 "Shengshi & Zhishi"
 mng_shengshi_zhishi_desc:0 "The history of dynasties past, as well as the story of ours, has always been dictated by ebbs and flows. Periods of growth, decadence, destruction and rebirth are all part of life. However, that should not be interpreted as that we cannot do our very best when it comes to ensuring the growth and government of our dynasty."
 mng_kingdom_joseon_title:0 "Kingdom of Joseon"
 mng_kingdom_joseon_desc:0 "To the East lies the kingdom of Korea, a powerful ally and a potential threat to our continued rule. It would be deemed wise to take steps and resolve this situation either by diplomatic or military means so as to protect our interests."
 mng_repeal_or_improve_haijin_title:0 "Repeal or Improve Haijin"
 mng_repeal_or_improve_haijin_desc:0 "This mission will be unlocked by the event '§YThe Haijin Policy of the Na Naxi§!' and will determine the dynamic mission we will receive."
 mng_improve_haijin_policy_title:0 "[Root.GetPreviewColorMNG]Improve the Haijin Policy[Root.GetPreviewColorMNG_end]"
 mng_improve_haijin_policy_desc:0 "The existing status quo of the trade ban within our realm mostly serves to hurting our own bottom line. Despite preventing extensive trade relations with outsiders being the sensible path, there is much room to improve the existing policies and refine them for the betterment of our economic balance."
 mng_repeal_haijin_policy_title:0 "[Root.GetPreviewColorMNG]Repeal the Haijin Policy[Root.GetPreviewColorMNG_end]"
 mng_repeal_haijin_policy_desc:0 "Our markets have stayed closed to foreigners for far too long! It is time we strive towards a policy of modernization and open trade!"
 mng_expand_bogue_title:0 "Expand the Bogue"
 mng_expand_bogue_desc:0 "The river mouth in [667.GetName] is known throughout our realm as the beating heart of profitable business and the ferrying of valuable goods and grain. We must tirelessly work towards expanding it in order to accommodate higher volumes of goods for the growing needs of our people."
 mng_jing_hang_grand_canal_title:0 "The Jing Hang Grand Canal"
 mng_jing_hang_grand_canal_desc:0 "To master the tide and floods that erupt across the riverbanks of our great nation is a skill that will prove to be vital, if we are to survive the coming centuries. Floods have been the catalyst events behind the rise and fall of those who were here before us and as such we must take the necessary steps to make sure we do not end up as just another brief mention in the history books."
 mng_expand_yongle_dadian_title:0 "Yongle Dadian"
 mng_expand_yongle_dadian_desc:0 "The advent of printing and copying literary works in China is a revolutionary technique that permits the spread and preservation of knowledge. By improving upon the techniques of our forefathers we may succeed in spreading the Yongle Emperor's grandest encyclopedic work, encompassing hundreds of volumes of knowledge."
 mng_heavens_will_title:0 "Heaven's Will"
 mng_heavens_will_desc:0 "The torch of the Heavens has passed onto our dynasty. To prove worthy and harness the power of China, we must display the excellence and competence needed to reform and tame the country, a feat none had accomplished for long before our dynasty came to power. This is truly a test of favor towards the holder of the Mandate of Heaven."
 mng_thirteen_provinces_title:0 "The Thirteen Provinces"
 mng_thirteen_provinces_desc:0 "Our relations with our southern neighbors in Dai Viet have been quite tumultuous over the last few decades. Their royalty broke away from the loving embrace of the Chinese Emperor. We must remind them, however we see fit, where their allegiance lies."
 mng_end_sengoku_jidai_title:0 "End the Sengoku Jidai"
 mng_end_sengoku_jidai_desc:0 "Japan is home to wild warriors, power hungry lords and a war-like spirit that led to the dawn of the Sengoku Jidai era. We cannot tolerate such rowdy and dangerous behavior so close to our shores and thus must take action to secure the island for ourselves either directly or indirectly."
 mng_form_depots_title:0 "Form the Depots"
 mng_form_depots_desc:0 "Despite appointing loyal subjects and exhibiting the favor of the heavens, the people serving our illustrious Emperor may sometimes fall victims to their human nature. To counteract that, we may go ahead and found spy agencies to keep an eye on our subjects' affairs and internal dealings."
 mng_outer_city_beijing_title:0 "Outer City of [1816.GetName]"
 mng_outer_city_beijing_desc:0 "The city of [1816.GetName] has been the heart of China, being the home of innumerable amounts of our people within our realm. The increasing size of the populace yearns for an extension to the plans of the city, thus enlarging the living space within the urban domain."
 mng_fortify_coast_title:0 "Fortify the Coast"
 mng_fortify_coast_desc:0 "Our coasts have long been falling victims to senseless piracy, robbing our commoners of their hard-earned labor and, at times, stealing our shoreline locals into slavery. This situation is entirely intolerable and must therefore be addressed in the most drastic way possible."
