 nov_karelia_capital_boom: "The New Capital"
 desc_nov_karelia_capital_boom: "St. Baylonburg has become the thriving new capital, marking a significant development for our nation."
 nov_bogatyr: "The Bogatyr's Call"
 desc_nov_bogatyr: "Our warriors, the legendary bogatyrs, are the pride of our home in Kyivan lands, and their legacy continues to inspire us today."
 egy_sinai_secured: "Sinai Secured"
 desc_egy_sinai_secured: "The Sinai Peninsula has been successfully secured, ensuring the protection of our strategic and holy sites."
 mam_incense_trade: "The Incense Road"
 desc_mam_incense_trade: "The old gods demand their offerings. Frankincense and myrrh from the far south must flow through our ports, as they did in the days of the pharaohs. Alexandria, Damietta, and Suez, the three gates of Egypt, must all serve the incense road once more."

 nap_egyptian_trade_modifier: "Egyptian Trade Agreement"
 desc_nap_egyptian_trade_modifier: "A formal commercial understanding with the Egyptian court grants our merchants privileged access to the spice routes of the eastern Mediterranean."
 nap_egyptian_alliance_trade: "Alexandrian Pact"
 nap_egyptian_alliance_trade_desc: "A standing agreement with the Egyptian court grants our merchants privileged access to the markets of Alexandria and the eastern spice routes."

 egy_neapolitan_alliance_tech: "Anchovian Military Advisor"
 desc_egy_neapolitan_alliance_tech: "Anchovian officers and engineers have been seconded to the Egyptian army, accelerating the modernisation of its forces."
 nap_adriatic_gate: "Guardians of the Adriatic"
 nap_adriatic_gate_desc: "Our galleys patrol the Strait of Otranto and our customs houses at Durrës and Vlora tax every sail that passes. The Adriatic is an Anchovian lake."
 nap_libyan_colonies: "The Libyan Colonies"
 nap_libyan_colonies_desc: "The riches of the Roman history stems into Bengazi, and the fertile lands of Cyrenaica. We must establish and maintain our colonies to secure these valuable resources for our realm."
 nap_northern_italy: "Northern Italy"
 nap_northern_italy_desc: "Milan and Genoa are the richest cities in Italy, and for too long they have answered to others. The plain of Lombardy will be ours, and with it the wealth of the north."
 nap_develop_the_north: "Develop the North"
 nap_develop_the_north_desc: "Anchovian investment and Genoese capital have transformed the north of Italy. New workshops rise, old fields are drained, and the cities grow fat on the trade of two seas."
 nap_libyan_exploitation_unrest: "Resentment of the Libyan Estates"
 nap_libyan_exploitation_unrest_desc: "The tribes of the interior resent the new taxes and the requisitions of the royal factor. Bands of armed men gather in the hills, and the towns are sullen."
 nap_cyrenaica_boom: "The Cyrenaican Estates"
 nap_cyrenaica_boom_desc: "Greek and Arab farmers work the fertile terraces of the Cyrenaican plateau for Neapolitan masters. Grain, oil, and silphium flow through the ports of Benghazi and Derna into the markets of Naples."
 nap_indian_administration: "Anchovian India Administration"
 nap_indian_administration_desc: "A garrison, a customs house, and a resident factor. The province is quiet, the ledgers balance, and the caravans come."
 nap_indian_venture: "The Indian Trade"
 nap_indian_venture_desc: "Our ships now sail directly to India rather than buying pepper and cloves second-hand in Alexandria. Every port from Surat to Calicut knows the flag of the Anchovian crown."
 nap_gujarat_colony_modifier: "Anchovian Suratella"
 nap_gujarat_colony_modifier_desc: "Ahmedabad was only the beginning. The Saurashtra peninsula, the Tapti valley, and the plains of Patan are the rest of Gujarat, and Gujarat is the richest land in India. The Company will have them all."

 maj_southern_colonies_modifier: "Colonies in the South"
 maj_southern_colonies_modifier_desc: "Our explorers have charted the southern seas and planted the flag of the Majapahit on distant shores. The route south is ours to command, and the wealth of the Indies will flow through our hands."
 vec_colonial_autonomy: "Cape Self-Government"
 vec_colonial_autonomy_desc: "The Council of the Cape governs the settlement's internal affairs: its own courts, its own militia, its own land grants. It looks to Batavia for protection and direction, but its day-to-day business is its own."
 vec_tariff_income: "Company Tariffs"
 vec_tariff_income_desc: "Every ship that leaves the Cape pays duty to the Company. The settlement may grow rich on its own account, but the Company takes its share, and its share is generous."
 vec_australian_exploitation: "The Holland Estate"
 vec_australian_exploitation_desc: "The Bali-Dutch have established a presence in the southern lands, and it is our duty to secure our own foothold. The Holland Estate will serve as the base for our operations, ensuring that our influence extends across the new continent."
 vec_australian_resistance: "The Colonial Problem"
 vec_australian_resistance_desc: "Those who settled here resist our authority, challenging our control and complicating our efforts to establish a stable administration. But while we hold them, we can exploit them for all they have."
 maj_australian_profits: "Profits from the South"
 maj_australian_profits_desc: "The colonies in the southern lands have begun to yield significant returns. Trade, resource extraction, and local production all contribute to the wealth flowing back to the Majapahit treasury."

 lus_far_east_exploration: "Pilots of the Far East"
 lus_far_east_exploration_desc: "Our pilots have returned from the eastern seas with charts, rutters, and tales of islands beyond counting. The route to Cathay is now known, and it will not remain secret for long."
 lus_macau_factory: "A Factory in Macau"
 lus_macau_factory_desc: "The coasts of South China are rich and well-defended, but a single factory in Macau will allow us to tap into the lucrative trade with Cathay. Properly fortified and garrisoned, it will serve as our base for operations in the region."
 lus_china_trade: "Trade with Cathay"
 lus_china_trade_desc: "Our presence in Macau allows us to engage directly in the lucrative trade with Cathay. The flow of silver, silk, and spices enriches our coffers and strengthens our position in the eastern seas."
 lus_christian_macau: "Christian Macau"
 lus_christian_macau_desc: "The leased territory has been formally converted to the true faith. Its churches are endowed by the Crown, its merchants are bound to Lisbon by faith as well as profit, and its tea trade enriches both God and king."
 lus_jeju_mission: "Jeju Mission"
 lus_jeju_mission_desc: "The missionaries of Jeju have fanned out across the Yellow Sea, carrying the faith to Korea, Japan, and the Chinese coast. Their reports guide our priests and our merchants alike."

 lus_jeju_opposition: "The Yellow Sea Alarmed"
 lus_jeju_opposition_desc: "A European power has seized an island in our waters. The courts of Kyoto, Tsushima, and Hanseong have taken note and they are drilling their soldiers."
 chn_macau_trade: "Trade with Macau"
 chn_macau_trade_desc: "The southern barbarians have established a trading post on the Canton estuary, and their silver flows into the Na Naxi treasury. Strange ideas come with it, new instruments of navigation, new methods of accounting, new heresies from the churches of Europe. The mandarins permit it, for now."
 byz_eunuchs: "Eunuchs of the Byzantines"
 byz_eunuchs_desc: "The palace bureaucracy of Constantinople is dominated by eunuchs and courtiers who owe their position entirely to the Emperor, and who use it to enrich themselves at the Empire's expense. They obstruct reform, sell offices, and divert the treasury into their own hands. Until they are broken, Byzantium cannot be strong."
 nov_ugric_conversion: "Ugric Assimilation"
 nov_ugric_conversion_desc: "The Ugric tribes of the northern forests are being settled, baptised, and integrated into our realm. Their lands are brought under our control, their people are taught our ways, and their faith is aligned with ours. This process strengthens our hold over the eastern territories and ensures the spread of our culture and religion."
 nov_ugric_assimilation: "Ugric Assimilation"
 nov_ugric_assimilation_desc: "The Ugric tribes of the northern forests are being settled, baptised, and integrated into our realm. Their lands are brought under our control, their people are taught our ways, and their faith is aligned with ours. This process strengthens our hold over the eastern territories and ensures the spread of our culture and religion."

 tripartite_pact: "The Tripartite Pact"
 tripartite_pact_desc: "Lusitania, Bohemia, and the Two Sicilies are bound by treaty to consult on matters of war, trade, and succession. The pact makes each of them stronger, and any enemy of one an enemy of all three."
 por_mediterranean_dominance: "Mediterranean Dominance"
 por_mediterranean_dominance_desc: "Our influence over the Mediterranean Sea is unmatched. Our fleets patrol its waters, our merchants control its trade, and our allies respect our power. This dominance ensures our security and prosperity in the region."
 por_maghreb_conversion: "Maghreb Conversion"
 por_maghreb_conversion_desc: "The Catholic faith is being carried across the Maghreb at the point of the sword and the word of the missionary. The old mosques are quiet, the new churches are full, and within a generation the prayers of North Africa will be said in Latin."
 por_true_rome_modifier: "The True Rome"
 por_true_rome_modifier_desc: "The Papacy has been restored to Rome by Lusitanian arms, and the Holy Father looks to Lisbon, not to Vienna, not to Paris, not to the Italians, for the defence of the Church. Lusitania is now the eldest daughter of Rome, and the world knows it."
 restored_rome: "Rome Restored"
 restored_rome_desc: "The Most Catholic Emperor of Lusitania has restored the Holy Father to his throne in Rome, driving the usurpers from the Eternal City. The Curia will not forget this."
 por_papal_vassal_modifier: "The Captive Papacy"
 por_papal_vassal_modifier_desc: "The Holy See is a guest in the Pyrenees, entirely dependent on Lusitanian arms and Lusitanian charity. The cardinals know it. The kings of Europe know it. And the Pope, above all, knows it."
 chose_true_rome: "Chose the True Rome"
 chose_papal_vassal: "Chose the Captive Papacy"

 alb_the_old_levy: "The Old Levy"
 alb_the_old_levy_desc: "The system of levies that once filled Alba's armies has been revived, in miniature. Every freeholder in Albion knows his duty, and every lord knows how many men his lands must yield. It is not the host of the old kingdom restored not yet but it is a beginning."
 alb_london_development: "The Growing Capital"
 alb_london_development_desc: "With the Thames secured and the roads to the south open, Lundain is growing faster than it has in a hundred years. Merchants, craftsmen, and clerks are drawn to the restored court, and the city spreads westward along the river."
 alb_welsh_trade: "The Welsh Ports"
 alb_welsh_trade_desc: "The harbours of Wales now fly our flag. Bristol, Cardiff, and the western anchorages are open to our merchants, and the trade of the Irish Sea flows through Albion hands."
 alb_irish_production: "The Irish Estates"
 alb_irish_production_desc: "The lands of Ireland are now under the control of Alba. The old estates have been reorganized, and the production of the island is directed to serve the crown. The wealth of Ireland flows into Albion's coffers, strengthening our realm."
 alb_alba_reformed: "Alba Restored"
 alb_alba_reformed_desc: "The kingdom of Alba has been reformed in full. Ireland and Britain answer to one crown, one faith, one law. The long work of restoration is complete and the work of empire begins."
 alb_old_faith: "The Old Faith Restored"
 alb_old_faith_desc: "The realm has returned to the faith of the pre-Roman church scripture in the vernacular, priests under the crown, and no tithe owed to Avignon. The missionaries of the new order are zealous, well-funded, and unafraid of a little blood."
 alb_oxford_university: "The Oxford Schools"
 alb_oxford_university_desc: "Oxford is not a great city. It is not a great port. It has no cathedral worth the name, no palace worth visiting, and its wool trade is respectable rather than remarkable. But Oxford has something the rest of the kingdom lacks: scholars. The monks of Oseney, the masters of the schools, the clerks who copy manuscripts by candlelight and argue about Aristotle at dawn, they are here, they have always been here, and the crown has begun to notice them.\n\nA king who is remembered is a king who founded something that outlasts him. A college, an endowment, a library that will bear his name for a thousand years. The court is beginning to think that way. Develop Oxford. Endow it. Make it a place the world will look to and the world will look to Alba in turn."
 alb_church_ascendant: "The Church Ascendant"
 alb_church_ascendant_desc: "The lands of the realm are being redistributed. The nobility have lost ground to the crown and the church, and the faith of the kingdom has been made materially secure. Its bishops advise the king, and its parishes collect the tithes that once went to the lords."
 alb_grand_navy: "The Grand Navy"
 alb_grand_navy_desc: "The fleet of Alba has been rebuilt. Its great ships and light cruisers patrol the Irish Sea and the Channel, and the flag of the kingdom flies from Lundain to the Hebrides."
 alb_imperial_shores: "Imperial Shores"
 alb_imperial_shores_desc: "Alba has planted its first colony in the New World. Whatever else the coming centuries bring, the flag of the kingdom will fly on the far side of the Atlantic."
 alb_jewel_of_channel: "The Jewel of the Channel"
 alb_jewel_of_channel_desc: "The flagship of Alba has become the most famous vessel in the Channel. She has led the fleet through storms and wars, carried the crown's envoys to Lisbon and Copenhagen, and returned every time without a scratch on her hull. She is the kingdom's pride afloat."
 alb_red_coats: "The Red Coats"
 alb_red_coats_desc: "The soldiers of Alba have long been known for their discipline and courage, but the world is changing. To maintain our place among the great powers, we must modernize our army, equip it with the latest uniforms and weapons, and instill in every man the pride of serving the crown. The red coats will be a symbol of Alba's strength and resolve."
 alb_rock_of_europe: "The Rock of Europe"
 alb_rock_of_europe_desc: "Brittany is not France, whatever the French kings may claim. Its people speak a Celtic tongue older than the Roman conquest. Its saints are the saints of Ireland and Wales. Its sailors have fished the Atlantic since before there were kings in Paris. When the Britons fled the Saxon invasions, they did not vanish, they crossed the sea and made a new home on the far shore. They are our cousins, however long we have been apart.\n\nAnd they hold the finest harbours in the western approaches. Brest, Saint-Malo, Nantes, the gateways to the Channel and the Atlantic beyond. Whoever holds Brittany holds the western sea. That must be us."
 alb_brittany_ports: "The Ports of Brittany"
 alb_brittany_ports_desc: "Alba has secured control over the key ports of Brittany. Brest, Saint-Malo, and Nantes now serve as vital hubs for our navy and trade, ensuring our dominance in the western seas."
 alb_peaceful_return: "The Peaceful Return"
 alb_peaceful_return_desc: "The lands that were once lost to foreign powers have returned to Alba without bloodshed. The kingdom has expanded its influence peacefully, and the people welcome the crown's protection and governance."
 gbh_peaceful_return: "The Peaceful Return"
 gbh_peaceful_return_desc: "In exchange for returning the Kentish counties to Alba, the Kingdom of Bohemia has been granted permanent access to Alba's ports and merchant networks. For an inland kingdom, this is worth more than three distant counties."
 alb_forced_return: "The Forced Return"
 alb_forced_return_desc: "The lands that were once lost to foreign powers have been returned to Alba through force. The kingdom has reasserted its authority, and the people have come under the crown's protection and governance, whether they welcomed it or not."
 alb_parliament_confidence: "Parliamentary Confidence"
 alb_parliament_confidence_desc: "The relationship between the Crown and Parliament has been formalized and strengthened. Both institutions now operate with a clear understanding of their rights and responsibilities, ensuring stability and confidence in the governance of Alba."
 alb_parliament_title: "The Act of Crown and Parliament"
 alb_parliament_desc: "A bill formalising the relationship between Crown and Parliament, and confirming the rights and privileges of both."
 alb_religious_settlement: "The Religious Settlement"
 alb_religious_settlement_desc: "The crown has reached a settlement with the church, balancing the interests of religious reform and royal authority. This agreement ensures the stability of Alba while addressing the concerns of the faithful."
 alb_civil_war_survived: "The State of the Nation Survived"
 alb_civil_war_survived_desc: "The kingdom has endured internal strife and emerged stronger. The crown has successfully navigated the turbulent times, maintaining stability and unity within Alba."
 alb_standing_army: "The Standing Army"
 alb_standing_army_desc: "The crown has decided to maintain a permanent, professional army to ensure the security of Alba. This standing force will be well-trained, well-equipped, and ready to respond to threats both at home and abroad, reflecting the kingdom's commitment to military preparedness and national defense."
 ab_passed_an_act: "Passed an Act of Parliament"
 ab_king_in_parliament: "The New Parliament"
 ab_king_in_parliament_desc: "The new Parliament has been convened, with the King taking an active role in its proceedings, shaping the legislative agenda and influencing the governance of the kingdom."
 alb_expanded_parliament: "The Expansion of Parliament"
 alb_expanded_parliament_desc: "The powers and influence of Parliament have been expanded, allowing for greater participation in the governance of the kingdom and ensuring a more balanced relationship between the Crown and the legislative body."
 alb_republic_of_virtue: "The Republic of Virtue"
 alb_republic_of_virtue_desc: "The kingdom has embraced the principles of civic virtue and republican governance. Alba seeks to cultivate a society where citizens are actively engaged in public life, and the government operates with transparency, accountability, and a commitment to the common good."
 alb_settled_crown: "The Settled Crown"
 alb_settled_crown_desc: "The crown has established a stable and enduring presence, consolidating its authority and ensuring the continuity of governance. This settled state allows Alba to focus on long-term development and the well-being of its people."